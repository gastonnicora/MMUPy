name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: MMUPy-Windows.exe

          - os: ubuntu-latest
            name: Linux
            artifact: MMUPy-Linux

          - os: macos-latest
            name: macOS
            artifact: MMUPy-macOS.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MMUPy main.py

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --noconfirm --clean --onefile --name MMUPy main.py

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --clean --windowed --name MMUPy main.py

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Rename-Item "dist/MMUPy.exe" "MMUPy-Windows.exe"

      - name: Prepare Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist/MMUPy dist/MMUPy-Linux

      - name: Prepare macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r MMUPy-macOS.zip MMUPy.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MMUPy-${{ matrix.name }}
          path: |
            dist/MMUPy-Windows.exe
            dist/MMUPy-Linux
            dist/MMUPy-macOS.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MMUPy-Windows/MMUPy-Windows.exe
            release/MMUPy-Linux/MMUPy-Linux
            release/MMUPy-macOS/MMUPy-macOS.zip
          generate_release_notes: true
