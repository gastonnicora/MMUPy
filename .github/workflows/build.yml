name: Build MMUPy

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller

      - name: Build MMUPy
        shell: powershell
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name MMUPy `
            --paths . `
            --collect-all PySide6 `
            --collect-submodules gui `
            --collect-submodules core `
            main.py

      - name: Rename executable
        shell: powershell
        run: |
          Rename-Item dist/MMUPy.exe MMUPy-Windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: MMUPy-Windows
          path: dist/MMUPy-Windows.exe


  # ============================================================
  # LINUX
  # ============================================================

  linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller

      - name: Build MMUPy
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name MMUPy \
            --paths . \
            --collect-all PySide6 \
            --collect-submodules gui \
            --collect-submodules core \
            main.py

      - name: Rename executable
        run: |
          mv dist/MMUPy dist/MMUPy-Linux
          chmod +x dist/MMUPy-Linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v5
        with:
          name: MMUPy-Linux
          path: dist/MMUPy-Linux


  # ============================================================
  # MACOS
  # ============================================================

  macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 PyInstaller

      - name: Build MMUPy
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name MMUPy \
            --paths . \
            --collect-all PySide6 \
            --collect-submodules gui \
            --collect-submodules core \
            main.py

      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r ../MMUPy-macOS.zip MMUPy.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: MMUPy-macOS
          path: MMUPy-macOS.zip


  # ============================================================
  # RELEASE
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - windows
      - linux
      - macos

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows
        uses: actions/download-artifact@v5
        with:
          name: MMUPy-Windows
          path: release

      - name: Download Linux
        uses: actions/download-artifact@v5
        with:
          name: MMUPy-Linux
          path: release

      - name: Download macOS
        uses: actions/download-artifact@v5
        with:
          name: MMUPy-macOS
          path: release

      - name: List release files
        run: |
          ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/MMUPy-Windows.exe
            release/MMUPy-Linux
            release/MMUPy-macOS.zip
          generate_release_notes: true